<!doctype html>

<body>
  <div class="read-progress" aria-hidden="true"><span id="readProgress"></span></div>
  <a class="skip" href="#main" data-t="skip">İçeriğe geç</a>

  <header class="header" id="header">

          <b data-c="shortName">Diş Polikliniği</b>
          <small data-c="taglineShort">Ağız ve Diş Sağlığı</small>
        </span>
      </a>

      <nav class="nav" id="nav" aria-label="Main">
        <a href="#treatments" data-nav="0">Tedaviler</a>
        <a href="#doctors" data-nav="1">Hekimler</a>
        <a href="#gallery" data-nav="2">Klinik</a>
        <a href="#faq" data-nav="3">SSS</a>
        <a href="#contact" data-nav="4">İletişim</a>

      <div class="header__right">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="tr" aria-pressed="true">TR</button><button type="button"
            data-lang="en">EN</button><button type="button" data-lang="ar">AR</button>
        </div>
        <a class="btn btn--ghost btn--sm hide-sm js-tel" href="#" aria-label="Telefon">
          <svg class="i">
            <use href="#i-phone" />
          </svg>
        </a>
        <a class="btn btn--primary btn--sm hide-sm js-wa" href="#" target="_blank" rel="noopener noreferrer">
          <svg class="i">
            <use href="#i-wa" />
          </svg><span data-t="book">Bilgi alın</span>

        <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"

  <main id="main">
    <!-- HERO -->
    <section class="hero" id="top">
      <div class="container hero__in">
        <div class="hero__text reveal">
          <div class="hero__top-meta">
            <p class="eyebrow"><span class="eyebrow__dot" aria-hidden="true"></span><span data-t="heroEyebrow"></span>
            </p>
            <a href="#reviews" class="hero__rating" id="heroRating" hidden>
              <svg class="g-ic" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4"
                  d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z" />
                <path fill="#34A853"

                <path fill="#EA4335"

              </svg>
              <strong id="heroRatingVal">4.9</strong>
              <span class="stars-inline" aria-hidden="true">★★★★★</span>
              <span id="heroRatingCount"></span>
            </a>
          </div>
          <h1><span data-t="heroTitle"></span> <em data-t="heroTitleAccent"></em></h1>
          <p class="lead" data-t="heroSub"></p>
          <div class="hero__btns">
            <a class="btn btn--wa js-wa" href="#" target="_blank" rel="noopener noreferrer">
              <svg class="i">
                <use href="#i-wa" />
              </svg><span data-t="wa"></span>
            </a>
            <a class="btn btn--ghost js-tel" href="#">
              <svg class="i">
                <use href="#i-phone" />
              </svg><span data-t="call"></span>
            </a>
          </div>
          <ul class="chips" id="chips"></ul>
        </div>

        <div class="hero__media reveal">
          <div class="hero__frame">
            <img id="heroImg" src="/img/hero.webp" alt="" width="1000" height="1250" fetchpriority="high"
              decoding="async">
          </div>
          <div class="hero__card hide-sm">
            <span class="hero__card-ic"><svg class="i">
                <use href="#i-scan" />
              </svg></span>
            <div><b data-t="heroCardTitle"></b><small data-t="heroCardText"></small></div>
          </div>
          <div class="status" id="status">
            <span class="dot" aria-hidden="true"></span>
            <div><b id="statusText"></b><small id="statusHours"></small></div>
          </div>
        </div>
      </div>
    </section>

    <!-- STATS / STANDARDS -->
    <section class="strip" aria-label="Klinik özeti">
      <div class="container strip__in">
        <div class="strip__stats" id="stats"></div>
        <div class="strip__standards" id="standards"></div>
      </div>
    </section>

    <!-- TREATMENTS -->
    <section class="section" id="treatments">
      <div class="container">
        <header class="sec-head sec-head--split reveal">
          <div>
            <p class="eyebrow" data-t="treatEyebrow"></p>
            <h2 data-t="treatTitle"></h2>
          </div>
          <p class="sec-head__sub" data-t="treatSub"></p>
        </header>
        <div class="treat-featured" id="treatFeatured"></div>
        <div class="treat-grid treat-grid--compact" id="treatGrid"></div>
      </div>
    </section>

    <!-- CLINICAL TECHNOLOGY (Interactive pure-white switcher) -->
    <section class="section section--soft" id="technology">
      <div class="container">
        <header class="sec-head sec-head--split reveal">
          <div>
            <p class="eyebrow" data-t="techEyebrow"></p>
            <h2 data-t="techTitle"></h2>
          </div>
          <p class="sec-head__sub" data-t="techSub"></p>
        </header>
        <div class="tech-grid reveal">
          <div class="tech-tabs" id="techTabs" role="tablist"></div>
          <div class="tech-panel" id="techPanel" role="tabpanel"></div>
        </div>
      </div>
    </section>

    <!-- WHY -->
    <section class="section" id="why">
      <div class="container why__in">
        <div class="why__media reveal">
          <img id="whyImg" src="/img/why.webp" alt="" width="1100" height="825" loading="lazy" decoding="async">
          <div class="why__badge">
            <svg class="i">
              <use href="#i-scan" />
            </svg>
            <span data-t="heroCardTitle"></span>
          </div>
        </div>
        <div class="why__body reveal">
          <p class="eyebrow" data-t="whyEyebrow"></p>
          <h2 data-t="whyTitle"></h2>
          <p class="sec-head__sub" data-t="whySub"></p>
          <ul class="why__list" id="whyList"></ul>
        </div>
      </div>
    </section>

    <!-- DOCTORS -->
    <section class="section" id="doctors">
      <div class="container">
        <header class="sec-head sec-head--split reveal">
          <div>
            <p class="eyebrow" data-t="docEyebrow"></p>
            <h2 data-t="docTitle"></h2>
          </div>
          <p class="sec-head__sub" data-t="docSub"></p>
        </header>
        <div class="docs" id="docGrid"></div>
      </div>
    </section>

    <!-- PROCESS -->
    <section class="section section--soft" id="process">
      <div class="container">
        <header class="sec-head reveal">
          <p class="eyebrow" data-t="procEyebrow"></p>
          <h2 data-t="procTitle"></h2>
        </header>
        <ol class="steps" id="timeline"></ol>
      </div>
    </section>

    <!-- REVIEWS (Google Değerlendirmeleri — balanced header + 2x2 dense grid) -->
    <section class="section" id="reviews">
      <div class="container">
        <div class="reviews__head reveal">
          <div class="reviews__head-left">
            <p class="eyebrow" data-t="revEyebrow"></p>
            <h2 data-t="revTitle"></h2>
            <p class="sec-head__sub" data-t="revSub"></p>
          </div>
          <div class="rev-score-inline">
            <div class="rev-score__top">
              <svg class="g-ic g-ic--lg" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z" />
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z" />
                <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z" />
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z" />
              </svg>
              <div>
                <div class="rev-score__num"><strong id="revScoreVal">4.9</strong><span>/ 5.0</span></div>
                <div class="rev-stars" aria-hidden="true">★★★★★</div>
                <p class="rev-score__meta" id="revScoreMeta"></p>
              </div>
            </div>
            <a class="btn btn--primary btn--sm js-route" target="_blank" rel="noopener noreferrer">
              <span data-t="revBtn"></span>
              <svg class="i"><use href="#i-arrow" /></svg>
            </a>
          </div>
        </div>
        <div class="reviews__grid" id="revList"></div>
        <p class="rev-note" data-t="revNote"></p>
      </div>
    </section>

    <!-- QUIZ (full-width 2-column rich block — zero empty margins) -->
    <section class="section section--soft" id="quiz">
      <div class="container">
        <div class="quiz-shell reveal">
          <div class="quiz-side">
            <div>
              <p class="eyebrow" data-t="quizEyebrow"></p>
              <h2 data-t="quizTitle"></h2>
              <p data-t="quizSub"></p>
              <ul class="quiz-perks" id="quizPerks"></ul>
            </div>
          </div>
          <div class="quiz">
            <div class="progress" aria-hidden="true"><span id="progress"></span></div>
            <div class="quiz__body" id="quizBody" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- GALLERY -->
    <section class="section" id="gallery">
      <div class="container">
        <header class="sec-head sec-head--split reveal">
          <div>
            <p class="eyebrow" data-t="galEyebrow"></p>
            <h2 data-t="galTitle"></h2>
          </div>
          <p class="sec-head__sub" data-t="galSub"></p>
        </header>
        <div class="gallery" id="galGrid"></div>
      </div>
    </section>

    <!-- FAQ -->
    <section class="section section--soft" id="faq">
      <div class="container faq__in">
        <div class="faq__head reveal">
          <p class="eyebrow" data-t="faqEyebrow"></p>
          <h2 data-t="faqTitle"></h2>
          <p class="sec-head__sub" data-t="faqSub"></p>
          <a class="btn btn--primary js-wa" target="_blank" rel="noopener noreferrer">
            <svg class="i">
              <use href="#i-wa" />
            </svg><span data-t="wa"></span>
          </a>
        </div>
        <div class="faq" id="faqList"></div>
      </div>
    </section>

    <!-- LOCAL -->
    <section class="section local">
      <div class="container local__in">
        <div class="reveal">
          <h2 data-t="localTitle"></h2>
          <p data-t="localText"></p>
        </div>
        <ul class="local__areas reveal" id="localAreas"></ul>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section section--soft" id="contact">
      <div class="container contact">
        <div class="contact__info reveal">
          <h2 data-t="contactTitle"></h2>
          <p class="sec-head__sub" data-t="contactSub"></p>
          <p class="contact__row"><svg class="i">
              <use href="#i-pin" />
            </svg><span data-c="address"></span></p>
          <p class="contact__row"><svg class="i">
              <use href="#i-phone" />
            </svg><a class="js-tel js-tel-text"></a></p>
          <p class="contact__row"><svg class="i">
              <use href="#i-ig" />
            </svg><a class="js-ig" target="_blank" rel="noopener noreferrer">Instagram</a></p>
          <h3 data-t="hoursT"></h3>
          <ul class="hours" id="hours"></ul>
          <div class="hero__btns">
            <a class="btn btn--wa js-wa" target="_blank" rel="noopener noreferrer">
              <svg class="i">
                <use href="#i-wa" />
              </svg><span data-t="waShort"></span>
            </a>
            <a class="btn btn--ghost js-route" target="_blank" rel="noopener noreferrer">
              <svg class="i">
                <use href="#i-route" />
              </svg><span data-t="route"></span>
            </a>
          </div>
        </div>
        <div class="map reveal">
          <iframe id="map" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          <a class="map__btn js-route" target="_blank" rel="noopener noreferrer">
            <svg class="i">
              <use href="#i-route" />
            </svg><span data-t="route"></span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__in">
      <div class="footer__brand">
        <a href="#top" class="logo logo--light">
          <span class="logo__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path fill="currentColor"
                d="M12 2c-1.7 0-2.6.8-4 .8S5.7 2 4.5 2C2.4 2 1 4.2 1 7.3c0 3.4 1.3 5.3 2 8.2.5 2.1.8 6.5 2.6 6.5 1.7 0 1.4-4.3 2.6-6.6.4-.7 1-1.1 1.8-1.1s1.4.4 1.8 1.1c1.2 2.3.9 6.6 2.6 6.6 1.8 0 2.1-4.4 2.6-6.5.7-2.9 2-4.8 2-8.2C23 4.2 21.6 2 19.5 2c-1.2 0-2.1.8-3.5.8S13.7 2 12 2Z" />
            </svg>

          <span class="logo__text"><b data-c="shortName"></b><small data-c="taglineShort">Ağız ve Diş

        <p class="small" data-c="responsibleDoctor"></p>
        <p class="small" data-c="license"></p>
      </div>

      <div>
        <h4 data-t="footerNav"></h4>
        <nav class="footer__links" id="footerNav"></nav>
      </div>

      <div>
        <h4 data-t="footerTreat"></h4>
        <ul class="footer__links" id="footerTreatList"></ul>
      </div>

      <div>
        <h4 data-t="footerContact"></h4>
        <p><a class="js-tel js-tel-text"></a></p>
        <p class="small" data-c="address"></p>
        <p><a class="js-ig" target="_blank" rel="noopener noreferrer">Instagram</a></p>
      </div>
    </div>

    <div class="container footer__bottom">
      <p class="small" data-t="disclaimer"></p>
      <p class="small"><button class="link" data-open-kvkk data-t="kvkkLink"></button> · © <span id="year"></span> <span
          data-c="shortName"></span>. <span data-t="rights"></span></p>
    </div>
  </footer>

  <div class="bar" id="bar">
    <a class="js-tel"><svg class="i">
        <use href="#i-phone" />
      </svg><span data-t="call"></span></a>
    <a class="bar__wa js-wa" target="_blank" rel="noopener noreferrer"><svg class="i">
        <use href="#i-wa" />
      </svg><span data-t="waShort"></span></a>
    <a class="js-route" target="_blank" rel="noopener noreferrer"><svg class="i">
        <use href="#i-route" />
      </svg><span data-t="route"></span></a>
  </div>
  <a class="fab js-wa" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><svg class="i">
      <use href="#i-wa" />
    </svg></a>

  <aside class="demo-bar" id="demoBar" hidden role="status">
    <span class="demo-bar__dot" aria-hidden="true"></span>
    <span id="demoText"></span>
    <button type="button" class="demo-bar__x" id="demoClose" aria-label="Close">×</button>

  <dialog class="modal modal--drawer" id="modal">

      <div id="modalBody"></div>

    <div class="lb__cap"><span class="lb__count" id="lbCount"></span><span id="lbCap"></span></div>
